<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time BTC/USDT TradingView Chart</title>
    <style>
        body {
            background-color: #131722;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
        }

        #tvchart {
            width: 90vw;
            height: 70vh;
            margin-top: 20px;
        }

        .info {
            color: #b2b5be;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
    <!-- Load Lightweight Charts dari CDN (Versi dipatok ke 4.1.1 untuk menghindari bug versi terbaru) -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body>
    <h1>Real-Time BTC Pipeline (Yfinance > Kafka > Spark)</h1>
    <div class="info">Candles dihitung secara Real-Time oleh Spark</div>
    <div id="tvchart"></div>

    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            fetch('/log_error', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'global', message: message, line: lineno }) });
        };

        // Inisialisasi Chart
        const chartProperties = {
            layout: {
                background: { type: 'solid', color: '#131722' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
            },
            timeScale: { timeVisible: true, secondsVisible: false },
        };

        const chart = LightweightCharts.createChart(document.getElementById('tvchart'), chartProperties);
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350'
        });

        const eventSource = new EventSource('/stream');

        let candlesData = [];
        let updateTimeout = null;

        eventSource.onmessage = function (event) {
            try {
                const data = JSON.parse(event.data);

                const timeDate = new Date(data.window_end);
                const timeUnix = Math.floor(timeDate.getTime() / 1000);

                const existingIndex = candlesData.findIndex(c => c.time === timeUnix);
                const candle = {
                    time: timeUnix,
                    open: data.open,
                    high: data.high,
                    low: data.low,
                    close: data.close
                };

                if (existingIndex !== -1) {
                    candlesData[existingIndex] = candle;
                } else {
                    candlesData.push(candle);
                }

                if (!updateTimeout) {
                    updateTimeout = setTimeout(() => {
                        try {
                            candlesData.sort((a, b) => a.time - b.time);
                            candleSeries.setData(candlesData);
                        } catch (err) {
                            fetch('/log_error', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'setData', error: err.toString(), data: candlesData.slice(-5) }) });
                        }
                        updateTimeout = null;
                    }, 50);
                }
            } catch (err) {
                fetch('/log_error', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'onmessage', error: err.toString() }) });
            }
        };

        eventSource.onerror = function (err) {
            console.error("EventSource failed:", err);
            // fetch('/log_error', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({type: 'sse_error'}) });
        };
    </script>
</body>

</html>
